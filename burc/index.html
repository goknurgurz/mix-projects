<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burç ve Günlük Yorum Uygulaması</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #4b0082;
        }
        form {
            margin: 20px auto;
            max-width: 400px;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input[type="date"] {
            padding: 10px;
            width: 100%;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #4b0082;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #6a5acd;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
            max-width: 600px;
            margin: 20px auto;
            text-align: left;
            line-height: 1.5;
            max-height: 400px; /* Uzun yorumlar için scroll */
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff;
        }
        #result strong {
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>

    <h1>Burç ve Günlük Yorum Uygulaması</h1>
    <form id="birthForm">
        <label for="birthdate">Doğum Tarihinizi Girin:</label><br>
        <input type="date" id="birthdate" required><br>
        <button type="submit">Hesapla</button>
    </form>
    <div id="result"></div>

            if ((month == 6 && day >= 21) || (month == 7 && day <= 22)) return "Yengeç";
            if ((month == 7 && day >= 23) || (month == 8 && day <= 22)) return "Aslan";
            if ((month == 8 && day >= 23) || (month == 9 && day <= 22)) return "Başak";
            if ((month == 9 && day >= 23) || (month == 10 && day <= 22)) return "Terazi";
            if ((month == 10 && day >= 23) || (month == 11 && day <= 21)) return "Akrep";
            if ((month == 11 && day >= 22) || (month == 12 && day <= 21)) return "Yay";
            if ((month == 12 && day >= 22) || (month == 1 && day <= 19)) return "Oğlak";
            if ((month == 1 && day >= 20) || (month == 2 && day <= 18)) return "Kova";
            if ((month == 2 && day >= 19) || (month == 3 && day <= 20)) return "Balık";
            return "Geçersiz tarih";
