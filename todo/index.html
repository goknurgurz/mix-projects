<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Görev Defteri</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container py-4">
    <h1 class="fw-bold">Görev Defteri</h1>
    <p class="text-secondary">Görev ekle, JavaScript’in adımlarını sağdaki günlükte izle.</p>

    <div class="row g-4">

      <section class="col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5 mb-3">Yeni görev</h2>

            <form id="form" class="row g-2">
              <div class="col-8">
                <input type="text" id="gorevInput" class="form-control" placeholder="Örn. JavaScript ödevini bitir" maxlength="60" autocomplete="off">
              </div>
              <div class="col-4">
                <select id="oncelikSec" class="form-select">
                  <option>Düşük</option>
                  <option selected>Orta</option>
                  <option>Yüksek</option>
                </select>
              </div>
              <div class="col-12 d-grid">
                <button type="submit" class="btn btn-primary">Ekle</button>
              </div>
              <p id="uyari" class="text-danger small mb-0"></p>
            </form>

            <ul id="liste" class="list-group mt-3"></ul>

            <div class="d-flex justify-content-between align-items-center mt-3">
              <span id="sayac" class="text-secondary small"></span>
              <button id="temizleBtn" type="button" class="btn btn-sm btn-outline-secondary">Tamamlananları temizle</button>
            </div>
          </div>
        </div>
      </section>

      <section class="col-lg-6">
        <div class="card log-karti">
          <div class="card-body">
            <h2 class="h5 text-white mb-3">Çalışma günlüğü</h2>
            <ol id="log" class="list-unstyled small mb-0"></ol>
          </div>
        </div>
      </section>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
